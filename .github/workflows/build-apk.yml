name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  apk:
    name: Build test APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create --platforms=android --project-name mishkat --org com.mishkat .

      - name: Add local notification permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permissions = [
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.SCHEDULE_EXACT_ALARM',
              'android.permission.VIBRATE',
              'android.permission.WAKE_LOCK',
          ]
          additions = ''.join(
              f'    <uses-permission android:name="{name}" />\n'
              for name in permissions
              if name not in s
          )
          marker = '<application'
          s = s.replace(marker, additions + marker, 1)
          p.write_text(s)
          PY

      - name: Enable core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          s = s.replace('compileOptions {', 'compileOptions {\n            isCoreLibraryDesugaringEnabled = true', 1)
          if 'coreLibraryDesugaring' not in s:
              s += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'
          p.write_text(s)
          PY

      - name: Remove Flutter template test
        run: rm -f test/widget_test.dart

      - name: Fetch core package
        working-directory: packages/mishkat_core
        run: dart pub get

      - name: Fetch packages
        run: flutter pub get

      - name: Generate l10n and Drift sources
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Verify
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build debug APK for testing
        run: flutter build apk --debug

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk artifacts/mishkat-debug.apk
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/mishkat-release.apk
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mishkat-apk
          path: artifacts/
          retention-days: 14
