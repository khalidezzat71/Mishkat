name: Build APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  apk:
    name: Build test APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true

      - name: Generate platform folders
        run: flutter create --platforms=android --project-name mishkat --org com.mishkat .

      - name: Fetch packages
        run: flutter pub get

      - name: Generate l10n and Drift sources
        run: |
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs

      - name: Verify
        run: flutter analyze

      - name: Build debug APK for testing
        run: flutter build apk --debug

      - name: Build release APK
        run: flutter build apk --release

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk artifacts/mishkat-debug.apk
          cp build/app/outputs/flutter-apk/app-release.apk artifacts/mishkat-release.apk
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mishkat-apk
          path: artifacts/
          retention-days: 14
