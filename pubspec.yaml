name: mishkat
description: "Mishkat — prayer, Quran and memorization with offline-first Sunni sources."
version: 0.1.0+1
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  mishkat_core:
    path: packages/mishkat_core

  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.6.1

  drift: 2.35.3
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.4

  adhan_dart: ^2.0.0
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  workmanager: ^0.5.2
  home_widget: ^0.7.0

  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.2
  just_audio: ^0.9.40
  audio_session: ^0.1.21
  record: ^5.1.0
  permission_handler: ^11.3.0
  sensors_plus: ^5.0.1
  geolocator: ^13.0.2

  dio: ^5.7.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.20.3
  collection: ^1.18.0
  fl_chart: ^0.70.2
  archive: ^4.0.2
  crypto: ^3.0.3
  encrypt: ^5.0.3
  share_plus: ^10.0.2
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0
  device_info_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: 2.35.3
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/quran/
    - assets/data/
    - assets/fonts/
    - assets/audio/
